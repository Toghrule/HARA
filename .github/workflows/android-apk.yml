name: Android APK

# Builds an installable Android app (APK) on GitHub's servers, so no Android tools are needed on any PC.
# Run it by hand: GitHub -> Actions -> "Android APK" -> Run workflow, and give the server address the app
# should talk to (must be https). The APK is then under "Artifacts" on the finished run.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Server address the app talks to (https://...)"
        required: true
        default: "https://example.com"
  # Also builds when this file changes, so a change to the build itself is tried straight away.
  push:
    paths:
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://example.com' }}

      - uses: actions/upload-artifact@v4
        with:
          name: hara-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
