services:
  db:
    image: postgres:16-alpine
    container_name: hara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hara-postgres-data:
